name: Daily Stock AI Report Update

on:
  #schedule:
    # 📌 UTC 22:28 -> KST 매일 아침 07:28
    #- cron: '28 22 * * *'
    # 📌 UTC 11:28 -> KST 매일 저녁 20:28
    #- cron: '28 11 * * *'
  

  # 깃허브 Actions 탭에서 수동 실행 버튼 활성화
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 체크아웃
      uses: actions/checkout@v4

    - name: 파이썬 3.10 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
              

    - name: 필수 라이브러리 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install google-genai groq yfinance "pandas==2.2.2" beautifulsoup4 plotly requests PyGithub

    - name: main.py 자동으로 실행
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        # 📌 토스증권 API 키 추가
        TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
        TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
        FIXIE_URL: ${{ secrets.FIXIE_URL }}
      
      run: python main.py
