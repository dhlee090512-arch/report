name: Daily Stock Dashboard Auto-Update

on:
  schedule:
    # 매일 한국시간 기준 아침/저녁 자동 실행
    - cron: '0 22 * * *'  # KST 오전 7:00
    - cron: '0 9 * * *'   # KST 오후 6:00
  workflow_dispatch:     # 수동 실행 버튼 활성화

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install groq yfinance pandas beautifulsoup4 plotly requests PyGithub

    - name: Run main.py with Secrets
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: python main.py
