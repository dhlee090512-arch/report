name: Daily Stock AI Report Update

on:
  # 매일 한국시간 오전 7시 30분 & 오후 8시 30분 자동 실행
  schedule:
    # 30 22 * * * -> UTC 22:30 (KST 기준 다음날 07:30)
    # 30 11 * * * -> UTC 11:30 (KST 기준 당일 20:30)
    - cron: '30 22 * * *'
    - cron: '30 11 * * *'
  
  # 깃허브 웹페이지 Actions 탭에서 버튼 눌러 수동 실행
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 필수 패키지 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install groq yfinance "pandas==2.2.2" beautifulsoup4 plotly requests PyGithub

    - name: main.py 자체 실행
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: python main.py
