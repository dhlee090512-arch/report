name: Daily Stock Dashboard Auto-Update

on:
  schedule:
    # ⏰ 한국 시간(KST) 매일 아침 07:30 (UTC 기준 전날 22:30)
    - cron: '30 22 * * *'
    # ⏰ 한국 시간(KST) 매일 저녁 20:30 (UTC 기준 당일 11:30)
    - cron: '30 11 * * *'
  workflow_dispatch: # 필요할 때 깃허브 웹에서 수동으로 버튼 눌러 실행도 가능하게 설정

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 불러오기
      uses: actions/checkout@v4

    - name: 파이썬 3.10 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 필수 라이브러리 자동 설치
      run: |
        python -m pip install --upgrade pip
        pip install groq yfinance pandas==2.2.2 beautifulsoup4 plotly requests PyGithub

    - name: 대시보드 생성을 위한 main.py 실행
      run: python main.py
