<script>
function showMacroChart(chartType) {
    document.getElementById('cli-chart-container').style.display = 'none';
    document.getElementById('m2-chart-container').style.display = 'none';
    
    document.getElementById('card-cli').classList.remove('active');
    document.getElementById('card-m2').classList.remove('active');
    
    if (chartType === 'cli') {
        document.getElementById('cli-chart-container').style.display = 'block';
        document.getElementById('card-cli').classList.add('active');
    } else {
        document.getElementById('m2-chart-container').style.display = 'block';
        document.getElementById('card-m2').classList.add('active');
    }
}
</script>
